# Port Requirements by Deployment Role
# Based on: https://www2.microstrategy.com/producthelp/current/installconfig/en-us/Content/required_ports.htm

ports:
  intelligence_server:
    - port: 34952
      protocol: tcp
      description: "Intelligence Server"
      required: true
    - port: 9500
      protocol: tcp
      description: "Modeling Service"
      required: true
    - port: 8300
      protocol: tcp
      description: "Topology - Server RPC"
      required: true
    - port: 8301
      protocol: tcp
      description: "Topology - Serf LAN"
      required: true
    - port: 8302
      protocol: tcp
      description: "Topology - Serf WAN"
      required: true
    - port: 34962
      protocol: tcp
      description: "REST Server"
      required: true
    - port: 3000
      protocol: tcp
      description: "Collaboration Server"
      required: false

  web_server:
    - port: 8080
      protocol: tcp
      description: "Apache Tomcat (Library/Web/Mobile)"
      required: true
    - port: 8443
      protocol: tcp
      description: "Apache Tomcat HTTPS (optional)"
      required: false
    - port: 20100
      protocol: tcp
      description: "Strategy Export"
      required: false
    - port: 80
      protocol: tcp
      description: "Apache/Nginx HTTP (optional)"
      required: false
    - port: 443
      protocol: tcp
      description: "Apache/Nginx HTTPS (optional)"
      required: false

  platform_analytics:
    - port: 9092
      protocol: tcp
      description: "Apache Kafka"
      required: false
    - port: 2181
      protocol: tcp
      description: "Apache Zookeeper"
      required: false
    - port: 2888
      protocol: tcp
      description: "Zookeeper Peer Communication (Clustering)"
      required: false
    - port: 3888
      protocol: tcp
      description: "Zookeeper Leader Election (Clustering)"
      required: false
    - port: 6379
      protocol: tcp
      description: "Redis"
      required: false
    - port: 5432
      protocol: tcp
      description: "Strategy Repository (PostgreSQL)"
      required: false

deployment_roles:
  Combined:
    description: "Intelligence Server + Web Server on same host"
    ports:
      - intelligence_server
      - web_server
  
  Web-Only:
    description: "Web Server only"
    ports:
      - web_server
  
  IS-Only:
    description: "Intelligence Server only"
    ports:
      - intelligence_server
